name: Dependency malware & vulnerability monitor (rl-protect)
description: >-
  Periodically re-scan your dependency manifest with ReversingLabs rl-protect
  and get notified (GitHub Issues) only when new malware, tampering, or
  vulnerability findings appear — delta-only alerts against a committed baseline.
author: Kresimir Buric
branding:
  icon: shield
  color: red

inputs:
  rl-token:
    description: Spectra Assure Community (rlcmm*) or Portal (rls3c*) token
    required: true
  manifest-path:
    description: >-
      Path to the manifest/lockfile to scan. Empty = auto-detect (prefers
      lockfiles: package-lock.json, pnpm-lock.yaml, yarn.lock, poetry.lock,
      uv.lock, requirements.txt, Gemfile.lock, then manifests).
    required: false
    default: ""
  scan-profile:
    description: rl-protect scan profile (minimum | baseline | hardened)
    required: false
    default: baseline
  check-deps:
    description: Dependency types to check (passed to --check-deps)
    required: false
    default: release,develop,transitive
  baseline-path:
    description: Path (in the consumer repo) of the committed findings baseline
    required: false
    default: .rl-protect/baseline.json
  monitor-id:
    description: >-
      Identifies this monitor's durable state — its baseline branch and its
      two rolling issues. "auto" derives it from the manifest path, which
      keeps two monitors in one repo (a monorepo scanning a lockfile and a
      requirements file) from overwriting each other. Set it explicitly to
      separate two monitors on the same manifest, or to make two share a
      thread deliberately.
    required: false
    default: auto
  baseline-branch:
    description: >-
      Dedicated branch to store the baseline on, created as an orphan branch
      on first run. "auto" derives rl-protect-baseline/<monitor-id>, which
      keeps baseline commits out of the scanned branch's history and works
      unchanged when that branch is protected. A name uses that branch.
      Empty commits the baseline to the scanned branch itself, where it shows
      up in PR diffs — that branch must then accept direct pushes.
    required: false
    default: auto
  commit-baseline:
    description: >-
      Commit and push the updated baseline (needs contents write). If false,
      you must persist the rewritten baseline yourself: against a stale
      baseline every run repeats the same alerts and the issue's cumulative
      stats reset to a single-run snapshot.
    required: false
    default: "true"
  notify:
    description: Notification channel (issue | none). Job summary always written.
    required: false
    default: issue
  issue-label:
    description: >-
      Extra label applied to both buckets' rolling issues, for filtering and
      subscribing. It does not identify them — that is the per-monitor marker
      label derived from monitor-id.
    required: false
    default: rl-protect-monitor
  alert-on-first-run:
    description: Alert on all findings when no baseline exists yet
    required: false
    default: "false"
  fail-on:
    description: Fail the job on findings (never | critical | any-new)
    required: false
    default: never
  heartbeat-url:
    description: Optional URL (e.g. healthchecks.io) pinged after a successful run
    required: false
    default: ""
  python-version:
    description: Python version used to run rl-protect and the diff engine
    required: false
    default: "3.12"
  github-token:
    description: Token for issue notifications and baseline pushes
    required: false
    default: ${{ github.token }}

outputs:
  new-count:
    description: Number of new findings since the baseline
    value: ${{ steps.diff.outputs.new-count }}
  new-critical-count:
    description: Number of new/worsened malware or tampering findings
    value: ${{ steps.diff.outputs.new-critical-count }}
  resolved-count:
    description: Number of findings resolved since the baseline
    value: ${{ steps.diff.outputs.resolved-count }}
  has-alerts:
    description: '"true" when any new or worsened finding was detected'
    value: ${{ steps.diff.outputs.has-alerts }}
  has-critical-alerts:
    description: '"true" when a malware/tampering finding was detected'
    value: ${{ steps.diff.outputs.has-critical-alerts }}
  first-run:
    description: '"true" when this run created the initial baseline'
    value: ${{ steps.diff.outputs.first-run }}
  has-updates:
    description: '"true" when any finding was new, worsened, or resolved'
    value: ${{ steps.diff.outputs.has-updates }}
  delta-json:
    description: Path to the machine-readable delta report
    value: ${{ steps.diff.outputs.delta-json }}
  delta-artifact:
    description: Name of the uploaded artifact holding the full delta JSON
    value: ${{ steps.delta-artifact.outputs.name }}

runs:
  using: composite
  steps:
    # First, so a misconfiguration costs no entitlement units.
    - name: Validate inputs
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        COMMIT_BASELINE: ${{ inputs.commit-baseline }}
        EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        # The branch is not a choice this action offers. GitHub fires
        # `schedule:` on the default branch only, so no other branch can be
        # re-scanned periodically — and periodic re-scanning is the whole
        # point, since the lockfile sits still while the database moves. A
        # run elsewhere would write to the same baseline and the same issues
        # as the real monitor, and the symptom is silent: alternating
        # baselines, each run reporting the other's findings as resolved and
        # its own as new.
        SCANNED="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
        if [[ -z "$SCANNED" ]]; then
          echo "::error::No git checkout found in the workspace. Add actions/checkout before this action — it reads the manifest from the working tree and commits the baseline from it."
          exit 1
        fi
        if [[ "$SCANNED" == "HEAD" ]]; then
          echo "::error::HEAD is detached, so the scanned branch cannot be determined. This action needs a branch checkout — a SHA checkout or a pull_request trigger is not supported."
          exit 1
        fi
        DEFAULT="$EVENT_DEFAULT_BRANCH"
        if [[ -z "$DEFAULT" ]]; then
          # The scheduled-event payload carries no repository object.
          DEFAULT="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
        fi
        echo "scanned-branch=$SCANNED" >> "$GITHUB_OUTPUT"

        DRY_RUN=false
        if [[ "$SCANNED" != "$DEFAULT" ]]; then
          # Undocumented on purpose: a maintainer testing a change needs to
          # run it somewhere, and manual dispatch is the only trigger that
          # cannot fire by accident. It is scoped to a dry run because the
          # monitor id does not include the branch — an unscoped run here
          # would post into the real issues and overwrite the real baseline
          # in order to test them. Do not turn this into an input.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            DRY_RUN=true
            echo "::notice::Manual run on '$SCANNED', which is not the default branch ('$DEFAULT') — dry run: the scan, job summary and delta artifact are produced, but no baseline is committed and nothing is posted."
          else
            echo "::error::rl-protect-monitor runs on the default branch ('$DEFAULT') only; this run is on '$SCANNED'. Scheduled runs already fire on the default branch — add 'branches: [$DEFAULT]' to your push: trigger."
            exit 1
          fi
        fi
        echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"

        # An in-tree baseline is an explicit opt-in whose failure mode is a
        # rejected push *after* the scan has spent entitlement. Say so now
        # instead. Best-effort: `protected` does not reflect every ruleset
        # configuration, so mode 1's push failure stays the backstop.
        if [[ -z "$BASELINE_BRANCH" && "$DRY_RUN" == "false" \
              && "$COMMIT_BASELINE" == "true" ]]; then
          PROTECTED="$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEFAULT" --jq .protected 2>/dev/null || echo unknown)"
          if [[ "$PROTECTED" == "true" ]]; then
            echo "::error::baseline-branch is empty, which commits the baseline to '$DEFAULT' — but that branch is protected and will reject the push. Leave baseline-branch at 'auto' to keep the baseline on a dedicated branch instead."
            exit 1
          fi
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install rl-protect
      shell: bash
      run: python -m pip install --quiet rl-protect

    - name: Connect to Spectra Assure
      shell: bash
      env:
        RL_TOKEN: ${{ inputs.rl-token }}
      run: rl-protect server connect --rl-token="$RL_TOKEN"

    - name: Resolve manifest path
      id: manifest
      shell: bash
      env:
        MANIFEST_INPUT: ${{ inputs.manifest-path }}
      run: |
        if [[ -n "$MANIFEST_INPUT" ]]; then
          if [[ ! -f "$MANIFEST_INPUT" ]]; then
            echo "::error::manifest-path '$MANIFEST_INPUT' not found"
            exit 1
          fi
          echo "path=$MANIFEST_INPUT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Auto-detect: lockfiles first (they pin what is actually installed)
        for candidate in package-lock.json pnpm-lock.yaml yarn.lock \
                         poetry.lock uv.lock requirements.txt Gemfile.lock \
                         pyproject.toml setup.cfg package.json Gemfile; do
          if [[ -f "$candidate" ]]; then
            echo "Auto-detected manifest: $candidate"
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::No supported manifest found; set the manifest-path input"
        exit 1

    # Needs the resolved manifest, and runs before the scan so a bad id costs
    # no entitlement units. The id names durable state — a baseline branch and
    # two issue markers — so it is derived in Python, where the slugging and
    # the label-length cap are unit-tested, rather than in shell.
    - name: Resolve monitor identity
      id: identity
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        MANIFEST: ${{ steps.manifest.outputs.path }}
        MONITOR_ID: ${{ inputs.monitor-id }}
        BASELINE_BRANCH: ${{ inputs.baseline-branch }}
      run: |
        python -m monitor.identity \
          --manifest "$MANIFEST" \
          --monitor-id "$MONITOR_ID" \
          --baseline-branch "$BASELINE_BRANCH"

    - name: Scan with rl-protect
      shell: bash
      env:
        MANIFEST: ${{ steps.manifest.outputs.path }}
        SCAN_PROFILE: ${{ inputs.scan-profile }}
        CHECK_DEPS: ${{ inputs.check-deps }}
      run: |
        REPORT="$RUNNER_TEMP/rl-protect.report.json"
        # Exit code 1 just means findings exist — that is normal for a
        # monitor. Only a missing report is a real failure.
        set +e
        rl-protect scan "$MANIFEST" \
          --scan-profile="$SCAN_PROFILE" \
          --check-deps="$CHECK_DEPS" \
          --save-report="$REPORT"
        SCAN_EXIT=$?
        set -e
        echo "rl-protect scan exit code: $SCAN_EXIT (informational)"
        if [[ ! -s "$REPORT" ]]; then
          echo "::error::rl-protect produced no report — scan failed (exit $SCAN_EXIT)"
          exit 1
        fi
        echo "REPORT_PATH=$REPORT" >> "$GITHUB_ENV"

    - name: Resolve baseline location
      id: baseline
      shell: bash
      env:
        BASELINE_PATH: ${{ inputs.baseline-path }}
        BASELINE_BRANCH: ${{ steps.identity.outputs.baseline-branch }}
      run: |
        if [[ -z "$BASELINE_BRANCH" ]]; then
          # Baseline lives on the scanned branch — use it in place.
          echo "file=$BASELINE_PATH" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Baseline lives on a dedicated branch: fetch it (if it exists) into
        # a temp file so the scanned branch's working tree stays clean.
        BFILE="$RUNNER_TEMP/rl-protect-baseline.json"
        if git fetch --quiet origin "$BASELINE_BRANCH" 2>/dev/null; then
          if git cat-file -e "FETCH_HEAD:$BASELINE_PATH" 2>/dev/null; then
            git show "FETCH_HEAD:$BASELINE_PATH" > "$BFILE"
            echo "Fetched baseline from $BASELINE_BRANCH:$BASELINE_PATH"
          else
            echo "Branch $BASELINE_BRANCH exists but has no $BASELINE_PATH — treating as first run"
          fi
        else
          echo "Baseline branch $BASELINE_BRANCH does not exist yet — first run"
        fi
        echo "file=$BFILE" >> "$GITHUB_OUTPUT"

    - name: Diff against baseline
      id: diff
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        MONITOR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BASELINE_FILE: ${{ steps.baseline.outputs.file }}
        MANIFEST: ${{ steps.manifest.outputs.path }}
        ALERT_ON_FIRST_RUN: ${{ inputs.alert-on-first-run }}
      run: |
        EXTRA=()
        if [[ "$ALERT_ON_FIRST_RUN" == "true" ]]; then
          EXTRA+=(--alert-on-first-run)
        fi
        python -m monitor.main \
          --report "$REPORT_PATH" \
          --baseline "$BASELINE_FILE" \
          --manifest "$MANIFEST" \
          --out-dir "$RUNNER_TEMP/rl-protect-monitor-out" \
          "${EXTRA[@]}"

    # Uploaded before the notification, and unconditionally: the delta
    # comment groups its rows and caps its tables, so for a large scan the
    # ungrouped list this artifact carries is the only complete copy — and
    # the truncation notice in that comment points readers straight at it.
    # Runner temp is discarded at job end, so an un-uploaded delta.json is
    # gone.
    - name: Name the delta artifact
      id: delta-artifact
      shell: bash
      run: |
        # Unique per action step, so scanning several manifests in one
        # workflow does not collide (upload-artifact@v4 rejects duplicates).
        echo "name=rl-protect-delta-${{ github.job }}-${{ github.action }}" \
          >> "$GITHUB_OUTPUT"

    - name: Upload delta report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.delta-artifact.outputs.name }}
        path: ${{ steps.diff.outputs.delta-json }}
        if-no-files-found: error
        retention-days: 90

    - name: Notify via GitHub issue
      if: >-
        inputs.notify == 'issue'
        && steps.diff.outputs.has-updates == 'true'
        && steps.guard.outputs.dry-run != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PYTHONPATH: ${{ github.action_path }}
        ISSUE_LABEL: ${{ inputs.issue-label }}
        MARKER_CRITICAL: ${{ steps.identity.outputs.marker-critical }}
        MARKER_STANDARD: ${{ steps.identity.outputs.marker-standard }}
        CRITICAL_BODY: ${{ steps.diff.outputs.issue-critical-body }}
        STANDARD_BODY: ${{ steps.diff.outputs.issue-standard-body }}
        CRITICAL_COMMENT: ${{ steps.diff.outputs.issue-critical-comment }}
        STANDARD_COMMENT: ${{ steps.diff.outputs.issue-standard-comment }}
      run: |
        OUT="$RUNNER_TEMP/rl-protect-monitor-out"
        # An empty comment path means this bucket only resolved findings:
        # refresh its stats body, but post nothing and open nothing.
        notify_bucket() {
          local title="$1" body="$2" comment="$3"
          shift 3
          local mode=(--comment-file "$comment")
          if [[ -z "$comment" ]]; then
            mode=(--body-only)
          fi
          python -m monitor.gh_issue \
            --repo "$GITHUB_REPOSITORY" \
            --title-file "$title" \
            --body-file "$body" \
            "${mode[@]}" "$@"
        }
        # The first label is the marker: it names both the bucket and the
        # monitor, so the two lookups can never resolve to each other's thread
        # or to another manifest's. The bare labels that follow are for humans
        # to filter and subscribe on, and carry no meaning for the lookup.
        if [[ -n "$CRITICAL_BODY" ]]; then
          notify_bucket "$OUT/issue_critical.title" "$CRITICAL_BODY" \
            "$CRITICAL_COMMENT" \
            --label "$MARKER_CRITICAL" \
            --label "rl-protect-malware" --label "$ISSUE_LABEL"
        fi
        if [[ -n "$STANDARD_BODY" ]]; then
          notify_bucket "$OUT/issue_standard.title" "$STANDARD_BODY" \
            "$STANDARD_COMMENT" \
            --label "$MARKER_STANDARD" --label "$ISSUE_LABEL"
        fi

    - name: Commit updated baseline
      if: >-
        inputs.commit-baseline == 'true'
        && steps.guard.outputs.dry-run != 'true'
      shell: bash
      env:
        BASELINE_PATH: ${{ inputs.baseline-path }}
        BASELINE_BRANCH: ${{ steps.identity.outputs.baseline-branch }}
        BASELINE_FILE: ${{ steps.baseline.outputs.file }}
        SCANNED_BRANCH: ${{ steps.guard.outputs.scanned-branch }}
      run: |
        git config user.name "rl-protect-monitor[bot]"
        git config user.email "rl-protect-monitor@users.noreply.github.com"

        if [[ -z "$BASELINE_BRANCH" ]]; then
          # Mode 1: baseline lives on the scanned branch.
          if [[ -z "$(git status --porcelain -- "$BASELINE_PATH")" ]]; then
            echo "Baseline unchanged — nothing to commit"
            exit 0
          fi
          git add -- "$BASELINE_PATH"
          git commit -m "chore(rl-protect): update findings baseline [skip ci]"
          # Push first — usually nothing has advanced, so history is never
          # rewritten. Rebase only on rejection, and never swallow a failure:
          # a conflict leaves HEAD detached at the upstream commit, so the
          # push that follows sends origin its own tip back and exits 0. The
          # baseline is then silently lost and the next run re-alerts every
          # finding this one already reported. Failing keeps the baseline
          # uncommitted, which is the recoverable half of that trade.
          pushed=""
          for attempt in 1 2 3; do
            if git push origin "HEAD:$SCANNED_BRANCH"; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto $SCANNED_BRANCH"
            git fetch origin "$SCANNED_BRANCH"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Could not rebase the baseline commit onto $SCANNED_BRANCH. Resolve the conflict on $BASELINE_PATH, or set fetch-depth: 0 on actions/checkout if the shallow history is too short to rebase."
              exit 1
            fi
          done
          if [[ -z "$pushed" ]]; then
            echo "::error::Could not push the updated baseline to $SCANNED_BRANCH"
            exit 1
          fi
          echo "Baseline committed and pushed to $SCANNED_BRANCH"
          exit 0
        fi

        # Mode 2: baseline lives on a dedicated branch. Build the commit in
        # a temporary worktree so the scanned checkout is never touched; the
        # branch is created as an orphan (baseline-only history) on first run.
        #
        # Retried like mode 1, and for the same reason — a rejected push must
        # not end the run with the baseline uncommitted and the delta already
        # posted. Resolving is simpler here: each attempt rebuilds from the
        # branch's current tip and stages only this monitor's own path, so
        # another monitor's concurrent commit is preserved rather than
        # conflicted with. Same-monitor overlap is already serialised by the
        # workflow's concurrency group, but that group lives in a file the
        # consumer edits, so this cannot rely on it.
        WORKTREE="$RUNNER_TEMP/rl-protect-baseline-worktree"
        pushed=""
        for attempt in 1 2 3; do
          # A worktree left by the previous attempt would fail `worktree add`,
          # and its orphan branch ref survives in the shared repo once
          # committed — hence a fresh name per attempt.
          rm -rf "$WORKTREE"
          git worktree prune
          if git fetch --quiet origin "$BASELINE_BRANCH" 2>/dev/null; then
            git worktree add --detach "$WORKTREE" FETCH_HEAD
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --quiet --orphan "rlpm-tmp-$$-$attempt"
            git -C "$WORKTREE" rm -rfq . 2>/dev/null || true
          fi
          mkdir -p "$WORKTREE/$(dirname "$BASELINE_PATH")"
          cp "$BASELINE_FILE" "$WORKTREE/$BASELINE_PATH"
          git -C "$WORKTREE" add -- "$BASELINE_PATH"
          if git -C "$WORKTREE" diff --cached --quiet 2>/dev/null \
             && git -C "$WORKTREE" rev-parse --verify --quiet HEAD >/dev/null; then
            echo "Baseline unchanged — nothing to commit"
            pushed=1
            break
          fi
          git -C "$WORKTREE" commit -m "chore(rl-protect): update findings baseline"
          if git -C "$WORKTREE" push origin "HEAD:refs/heads/$BASELINE_BRANCH"; then
            pushed=1
            echo "Baseline committed and pushed to $BASELINE_BRANCH"
            break
          fi
          echo "Push to $BASELINE_BRANCH rejected (attempt $attempt) — rebuilding on its current tip"
        done
        git worktree remove --force "$WORKTREE" 2>/dev/null || true
        git worktree prune
        if [[ -z "$pushed" ]]; then
          echo "::error::Could not push the updated baseline to $BASELINE_BRANCH"
          exit 1
        fi

    - name: Check quota usage
      shell: bash
      run: |
        set +e
        LISTING="$(rl-protect server list 2>&1)"
        set -e
        USAGE_LINE="$(grep -oE 'Usage:[^,]*' <<< "$LISTING" | head -1)"
        echo "$USAGE_LINE"
        USED="$(grep -oE '[0-9]+ */ *[0-9]+' <<< "$USAGE_LINE" | awk -F/ '{gsub(/ /,""); print $1}')"
        TOTAL="$(grep -oE '[0-9]+ */ *[0-9]+' <<< "$USAGE_LINE" | awk -F/ '{gsub(/ /,""); print $2}')"
        if [[ -n "$USED" && -n "$TOTAL" && "$TOTAL" -gt 0 ]]; then
          PCT=$(( USED * 100 / TOTAL ))
          if (( PCT >= 85 )); then
            echo "::warning::Spectra Assure quota at ${PCT}% (${USED}/${TOTAL} units). Consider reducing scan cadence, narrowing check-deps scope, or upgrading from a Community account for a larger entitlement."
            echo "> ⚠️ Spectra Assure quota at **${PCT}%** (${USED}/${TOTAL} units this month)." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

    # Before the fail-on gate: the heartbeat says "the monitor ran", not "the
    # monitor found nothing". Pinging after the gate would skip the ping on
    # exactly the runs that worked — fail-on=critical plus a real malware
    # finding would page the on-call with a dead-monitor alert instead.
    # Not on a dry run: the heartbeat asserts that the monitor ran, and a
    # manual test from a branch would keep the signal green while the real
    # scheduled monitor was failing.
    - name: Heartbeat ping
      if: >-
        inputs.heartbeat-url != ''
        && steps.guard.outputs.dry-run != 'true'
      shell: bash
      env:
        HEARTBEAT_URL: ${{ inputs.heartbeat-url }}
      run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEARTBEAT_URL"

    - name: Evaluate fail-on gate
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        HAS_ALERTS: ${{ steps.diff.outputs.has-alerts }}
        HAS_CRITICAL: ${{ steps.diff.outputs.has-critical-alerts }}
      run: |
        case "$FAIL_ON" in
          critical)
            if [[ "$HAS_CRITICAL" == "true" ]]; then
              echo "::error::fail-on=critical — malware/tampering finding detected"
              exit 1
            fi ;;
          any-new)
            if [[ "$HAS_ALERTS" == "true" ]]; then
              echo "::error::fail-on=any-new — new findings detected"
              exit 1
            fi ;;
          *) echo "fail-on=$FAIL_ON — not gating" ;;
        esac

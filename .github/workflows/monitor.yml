# Reusable workflow — call this from your repo with `workflow_call`.
# See examples/consumer-reusable.yml for the consumer stanza.

name: rl-protect monitor

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: ""
      scan-profile:
        type: string
        default: baseline
      check-deps:
        type: string
        default: release,develop,transitive
      baseline-path:
        type: string
        default: .rl-protect/baseline.json
      monitor-id:
        type: string
        default: auto
      baseline-branch:
        type: string
        default: auto
      commit-baseline:
        type: string
        default: "true"
      notify:
        type: string
        default: issue
      issue-label:
        type: string
        default: rl-protect-monitor
      assignees:
        # Comma-separated. Without one, an alert reaches only repo watchers.
        type: string
        default: ""
      alert-on-first-run:
        type: string
        default: "false"
      fail-on:
        type: string
        default: never
    secrets:
      rl-token:
        required: true
      heartbeat-url:
        # Treated as a secret: healthchecks-style ping URLs embed a token.
        required: false
    # The action's outputs, passed through so a caller can build on them
    # (a Slack step on `has-critical-alerts`, say) without switching to the
    # direct-action form. `delta-json` is not among them: it is a path inside
    # this job's runner, gone by the time the caller's next job starts — the
    # `delta-artifact` output names the uploaded copy instead.
    outputs:
      new-count:
        value: ${{ jobs.monitor.outputs.new-count }}
      new-critical-count:
        value: ${{ jobs.monitor.outputs.new-critical-count }}
      changed-count:
        value: ${{ jobs.monitor.outputs.changed-count }}
      resolved-count:
        value: ${{ jobs.monitor.outputs.resolved-count }}
      has-alerts:
        value: ${{ jobs.monitor.outputs.has-alerts }}
      has-critical-alerts:
        value: ${{ jobs.monitor.outputs.has-critical-alerts }}
      has-updates:
        value: ${{ jobs.monitor.outputs.has-updates }}
      first-run:
        value: ${{ jobs.monitor.outputs.first-run }}
      delta-artifact:
        value: ${{ jobs.monitor.outputs.delta-artifact }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # baseline commit-back
      issues: write     # rolling notification issues
    concurrency:
      group: rl-protect-monitor-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      new-count: ${{ steps.rl.outputs.new-count }}
      new-critical-count: ${{ steps.rl.outputs.new-critical-count }}
      changed-count: ${{ steps.rl.outputs.changed-count }}
      resolved-count: ${{ steps.rl.outputs.resolved-count }}
      has-alerts: ${{ steps.rl.outputs.has-alerts }}
      has-critical-alerts: ${{ steps.rl.outputs.has-critical-alerts }}
      has-updates: ${{ steps.rl.outputs.has-updates }}
      first-run: ${{ steps.rl.outputs.first-run }}
      delta-artifact: ${{ steps.rl.outputs.delta-artifact }}
    steps:
      - uses: actions/checkout@v7

      - id: rl
        uses: kburich/rl-protect-monitor@v3
        with:
          rl-token: ${{ secrets.rl-token }}
          manifest-path: ${{ inputs.manifest-path }}
          scan-profile: ${{ inputs.scan-profile }}
          check-deps: ${{ inputs.check-deps }}
          baseline-path: ${{ inputs.baseline-path }}
          monitor-id: ${{ inputs.monitor-id }}
          baseline-branch: ${{ inputs.baseline-branch }}
          commit-baseline: ${{ inputs.commit-baseline }}
          notify: ${{ inputs.notify }}
          issue-label: ${{ inputs.issue-label }}
          assignees: ${{ inputs.assignees }}
          alert-on-first-run: ${{ inputs.alert-on-first-run }}
          fail-on: ${{ inputs.fail-on }}
          heartbeat-url: ${{ secrets.heartbeat-url || '' }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests/ -v

  smoke:
    # End-to-end run of the diff engine CLI against fixtures, the same way
    # action.yml invokes it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: First run creates baseline
        run: |
          python -m monitor.main \
            --report tests/fixtures/report_baseline.json \
            --baseline /tmp/baseline.json \
            --manifest package-lock.json \
            --out-dir /tmp/out
          test -s /tmp/baseline.json
      - name: Second run detects malware delta
        run: |
          python -m monitor.main \
            --report tests/fixtures/report_new_malware.json \
            --baseline /tmp/baseline.json \
            --manifest package-lock.json \
            --out-dir /tmp/out2
          grep -q '"new_critical": 1' /tmp/out2/delta.json
          # The comment is the delta's only durable copy — it doubles as the
          # body when the issue has to be created — so assert the finding
          # itself reached it, not just the headline.
          grep -q "ua-parser-js" /tmp/out2/issue_critical_comment.md
          grep -q "🚨 Malware/tampering: 1 new" /tmp/out2/issue_critical_comment.md
          grep -q "^issue-critical-alerts=true$" "$GITHUB_OUTPUT"
          # There is no separate stats body any more.
          test ! -e /tmp/out2/issue_critical.md

      - name: Third run comments the resolution after the malware clears
        run: |
          python -m monitor.main \
            --report tests/fixtures/report_baseline.json \
            --baseline /tmp/baseline.json \
            --manifest package-lock.json \
            --out-dir /tmp/out3
          # A resolution is a delta like any other: reported as a comment on
          # the open issue, without the siren — and flagged as not alerting,
          # which is what stops the notify step from ever opening an issue
          # for it.
          grep -q "Malware/tampering: 1 resolved" /tmp/out3/issue_critical_comment.md
          grep -q "Resolved findings" /tmp/out3/issue_critical_comment.md
          ! grep -q "🚨" /tmp/out3/issue_critical_comment.md
          grep -q "^issue-critical-alerts=false$" "$GITHUB_OUTPUT"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet pytest
      - run: python -m pytest tests/ -v

  smoke:
    # End-to-end run of the diff engine CLI against fixtures, the same way
    # action.yml invokes it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: First run creates baseline
        run: |
          python -m monitor.main \
            --report tests/fixtures/report_baseline.json \
            --baseline /tmp/baseline.json \
            --manifest package-lock.json \
            --out-dir /tmp/out
          test -s /tmp/baseline.json
      - name: Second run detects malware delta
        run: |
          python -m monitor.main \
            --report tests/fixtures/report_new_malware.json \
            --baseline /tmp/baseline.json \
            --manifest package-lock.json \
            --out-dir /tmp/out2
          grep -q '"new_critical": 1' /tmp/out2/delta.json
          # The comment is the delta's only durable copy — assert the finding
          # itself reached it. Grepping the body for "malware" would match its
          # constant intro sentence and pass with no delta rendered at all.
          grep -q "ua-parser-js" /tmp/out2/issue_critical_comment.md
          grep -q "Monitoring stats" /tmp/out2/issue_critical.md

      - name: Third run refreshes the body after the malware is resolved
        run: |
          python -m monitor.main \
            --report tests/fixtures/report_baseline.json \
            --baseline /tmp/baseline.json \
            --manifest package-lock.json \
            --out-dir /tmp/out3
          # A resolution-only run must still re-render the stats body, or the
          # open issue keeps asserting the pre-resolution counts forever.
          grep -q "Currently outstanding:\*\* 0" /tmp/out3/issue_critical.md
          grep -q "Resolved since then:\*\* 1" /tmp/out3/issue_critical.md
          # …and must not produce a comment, which would page subscribers.
          test ! -e /tmp/out3/issue_critical_comment.md
